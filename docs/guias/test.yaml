# 1. Document Start and Comments
# A triple dash indicates the beginning of a document. 
# Comments start with a hashtag.

# 2. Key-Value Pairs (Scalars)
# Colons must be followed by a space. Quotes are optional for simple strings.
app_name: "Inventory Tracker"
version: 2
is_production: false
pi_value: 3.14159
nil_value: null

# 3. Dictionaries / Maps (Nested Objects)
# Indentation dictates that 'city' and 'state' belong to 'location'
location:
  city: "San Francisco"
  state: "CA"
  country: "USA"

# 4. Lists / Sequences (Block Syntax)
# Items are denoted by a leading dash followed by a space
supported_regions:
  - "us-east"
  - "us-west"
  - "eu-central"

# 5. Inline Lists (Flow Syntax)
# An alternative JSON-like format for simple, short lists
allowed_formats: ["json", "yaml", "csv"]

# 6. List of Objects
# Combining maps and lists to create complex structural data
database_clusters:
  - name: "primary-db"
    role: "master"
    port: 5432
  - name: "replica-db-01"
    role: "replica"
    port: 5433

# 7. Multi-line Strings
# Literal Block Scalar (|): Preserves all newlines and formatting
description: |
  This application tracks hardware inventory.
  It sends alerts when stock drops below 10%.
  
# Folded Block Scalar (>): Replaces newlines with spaces (collapses to a single paragraph)
disclaimer: >
  Your use of this application constitutes acceptance 
  of our privacy policy and terms of service.
...