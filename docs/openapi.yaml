  /charges/fees/calculate:
    get:
      summary: Consultar taxas de uma transação
      description: ''
      operationId: consultar-taxas-transacao
      parameters:
        - name: payment_methods
          in: query
          description: >-
            Meios de pagamento dos quais o integrador gostaria de recuperar
