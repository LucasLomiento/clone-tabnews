  /orders/{order_id}/pay:
    post:
      summary: Pagar pedido
      description: ''
      operationId: pagar-pedido
      parameters:
        - name: order_id
          in: path
          description: >-
            Identificador do pedido PagBank. Formato: `ORDE_XXXXXXXXXXXX`
            <br/>Esse parâmetro você receberá na resposta da criação do pedido
            como `id`.
          schema:
            type: string
          required: true
        - name: Authorization
          in: header
          description: Token de autenticação. Deve ser enviado no formato `Bearer <token>`.
          required: true
          schema:
            type: string
            default: Bearer <token>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                charges:
                  type: array
                  description: >-
                    Contêm as informações necessárias para a execução da
                    cobrança, definindo os dados do meio de pagamento e o valor
                    do pedido.
                  items:
                    properties:
                      reference_id:
                        type: string
                        description: Identificador único atribuído para a cobrança.
                      description:
                        type: string
                        description: Descrição da cobrança.
                      amount:
                        type: object
                        description: Especifica a quantia da cobrança, com o valor e moeda.
                        properties:
                          value:
                            type: integer
                            description: >-
                              Valor a ser cobrado em centavos. Apenas números
                              inteiros positivos. <br/>Exemplo: R$ 1.500,99 =
                              150099
                            format: int32
                          currency:
                            type: string
                            description: >-
                              Código de moeda ISO de três letras, em maiúsculo.
                              Por enquanto, apenas o Real brasileiro é suportado
                              (BRL).
                      payment_method:
                        type: object
                        description: >-
                          Contém as informações do método de pagamento da
                          cobrança.
                        properties:
                          type:
                            type: string
                            description: >-
                              Indica o método de pagamento usado na cobrança.
                              <br>- `CREDIT_CARD` para Cartão de Crédito ou
                              `DEBIT_CARD` para Cartão de Débito. ⚠️
                              **Obrigatório o envio do objeto `card`.** ⚠️ <br>-
                              `BOLETO` para Boleto. ⚠️ **Obrigatório o envio do
                              objeto `boleto` com as informações adicionais
                              desse objeto.** ⚠️
                            enum:
                              - CREDIT_CARD
                              - DEBIT_CARD
                              - BOLETO
                          installments:
                            type: integer
                            description: >-
                              Quantidade de parcelas. ⚠️ **Obrigatório para o
                              método de pagamento Cartão de Crédito.** ⚠️
                            format: int32
                          capture:
                            type: boolean
                            description: >-
                              Parâmetro que indica se uma transação de cartão de
                              crédito deve ser apenas pré-autorizada (reserva o
                              valor da cobrança no cartão do cliente de 6 até 29
                              dias) ou se a transação deve ser capturada
                              automaticamente (cobrança realizada em apenas um
                              passo). ⚠️ **Obrigatório para o método de
                              pagamento cartão de crédito.** ⚠️ ⚠️ **Função
                              indisponível para o método de pagamento cartão de
                              débito e token de bandeira (crédito).** ⚠️ <br> -
                              `VISA`,`MASTERCARD` e `ELO` permitirá à captura
                              com cartão de crédito e token de bandeira em até
                              29 dias(<a
                              href="https://dev.pagbank.uol.com.br/docs/cobrando-com-cartao-de-credito"
                              target="_blank">Lista de MCCs
                              disponíveis</a>).<br>- `AMEX` e `HIPERCARD`
                              permitirá à captura apenas com o cartão de crédito
                              e em até 6 dias.  <br><br> - Informar `false` para
                              pré-autorizar. Informar `true` para cobrança em um
                              passo.
                          soft_descriptor:
                            type: string
                            description: >-
                              Parâmetro responsável pelo que será exibido como
                              **Nome na Fatura do cliente**. ⚠️ **Aplicável no
                              momento apenas para Cartão de crédito** ⚠️ ⚠️
                              **Não permite caracteres especiais. Acentuações
                              serão substituídas por caracteres sem acentos,
                              demais caracteres especiais serão removidos.** ⚠️
                          card:
                            type: object
                            description: >-
                              Objeto contendo os dados de Cartão de Crédito,
                              Cartão de Débito ou Token de Bandeira. ⚠️
                              **Obrigatório para o método de pagamento Cartão de
                              Crédito, Cartão de Débito ou Token de Bandeira.**
                              ⚠️
                            required:
                              - exp_month
                              - exp_year
                            properties:
                              id:
                                type: string
                                description: >-
                                  Identificador PagBank do Cartão de Crédito
                                  salvo (Cartão Tokenizado pelo PagBank). ⚠️
                                  **Função indisponível para o método de
                                  pagamento com Cartão de Débito e Token de
                                  Bandeira.** ⚠️
                              encrypted:
                                type: string
                                description: Criptograma do cartão criptografado.
                              number:
                                type: string
                                description: >-
                                  Número do Cartão de Crédito ou Cartão de
                                  Débito.
                              network_token:
                                type: string
                                description: Número do Token de Bandeira.
                              exp_month:
                                type: integer
                                description: >-
                                  Mês de expiração do Cartão de Crédito, Cartão
                                  de Débito ou Token de Bandeira.
                                format: int32
                              exp_year:
                                type: integer
                                description: >-
                                  Ano de expiração do Cartão de Crédito, Cartão
                                  de Débito ou Token de Bandeira.
                                format: int32
                              security_code:
                                type: string
                                description: >-
                                  Código de Segurança do Cartão de Crédito,
                                  Cartão de Débito ou Token de Bandeira.
                              store:
                                type: boolean
                                description: >-
                                  Indica se o cartão deverá ser armazenado no
                                  PagBank para futuras compras. ⚠️ **Função
                                  indisponível para o método de pagamento com
                                  Cartão de Débito e Token de Bandeira.**
                                  ⚠️<br>- Informar `false` ou omitir esse
                                  parâmetro fará com que o cartão não seja
                                  armazenado. Informar `true` fará com que o
                                  cartão seja armazenado. Na resposta da
                                  requisição irá receber o token do cartão em
                                  `payment_method.card.id`.
                              holder:
                                type: object
                                description: >-
                                  Contém as informações do portador do Cartão de
                                  Crédito, Cartão de Débito e Token de Bandeira.
                                properties:
                                  name:
                                    type: string
                                    description: >-
                                      Nome do portador do Cartão de Crédito,
                                      Cartão de Débito e Token de Bandeira. ⚠️
                                      **Obrigatório para cobranças com 3DS e
                                      Criptografia** ⚠️
                                  tax_id:
                                    type: string
                                    description: >-
                                      Documento de identificação (CPF) do
                                      portador do Cartão de Crédito, Cartão de
                                      Débito e Token de Bandeira.
                              token_data:
                                type: object
                                description: >-
                                  Objeto contendo os dados adicionais de
                                  Tokenização de Bandeira. ⚠️ **Deve ser enviado
                                  quando um Cartão de Crédito ou Débito
                                  Tokenizado pelas bandeiras Visa ou Mastercard
                                  é utilizado.** ⚠️
                                required:
                                  - cryptogram
                                properties:
                                  requestor_id:
                                    type: string
                                    description: >-
                                      Identificador de quem gerou o Token de
                                      Bandeira (Token Requestor).
                                  wallet:
                                    type: string
                                    description: >-
                                      Tipo de carteira que armazenou o Token de
                                      Bandeira.
                                    enum:
                                      - APPLE_PAY
                                      - GOOGLE_PAY
                                      - SAMSUNG_PAY
                                      - MERCHANT_TOKENIZATION_PROGRAM
                                  cryptogram:
                                    type: string
                                    description: Criptograma gerado pela bandeira.
                                  ecommerce_domain:
                                    type: string
                                    description: >-
                                      Identificador do domínio de origem da
                                      transação, comumente caracterizado em um
                                      formato de domínio reverso. <br>Exemplo:
                                      `br.com.pagseguro`
                                  assurance_level:
                                    type: integer
                                    description: >-
                                      Conteúdo que indica o nível de confiança
                                      do Token de Bandeira.
                                    format: int32
                          authentication_method:
                            type: object
                            description: >-
                              Objeto contendo os dados adicionais de
                              autenticação vínculados à uma transação. ⚠️
                              **Obrigatório para o método de pagamento com
                              cartão de débito.** ⚠️
                            required:
                              - eci
                            properties:
                              type:
                                type: string
                                description: >-
                                  Indica o método de autenticação utilizado na
                                  cobrança. ⚠️ **Condicional para Token de
                                  Bandeira ELO.** ⚠️<br>- `THREEDS` se o método
                                  de autenticação utilizado for 3DS. <br>-
                                  `INAPP` se o método de autenticação utilizado
                                  for InApp.
                                enum:
                                  - THREEDS
                                  - INAPP
                              id:
                                type: string
                                description: >-
                                  Identificador do método de autenticação
                                  utilizado.
                              cavv:
                                type: string
                                description: >-
                                  Identificador único gerado em cenário de
                                  sucesso de autenticação do cliente.
                              eci:
                                type: string
                                description: >-
                                  Indicador E-Commerce retornado quando ocorre
                                  uma autenticação. Corresponde ao resultado da
                                  autenticação.
                              xid:
                                type: string
                                description: >-
                                  Identificador de uma transação de um MPI -
                                  Recomendado para a bandeira `VISA`. ⚠️
                                  **Condicional para 3DS.** ⚠️
                              version:
                                type: string
                                description: >-
                                  Versão do protocolo 3DS utilizado na
                                  autenticação.
                              dstrans_id:
                                type: string
                                description: >-
                                  ID da transação gerada pelo servidor de
                                  diretório durante uma autenticação -
                                  Recomendado para a bandeira `MASTERCARD`. ⚠️
                                  **Condicional para 3DS.** ⚠️
                          boleto:
                            type: object
                            description: >-
                              Objeto contendo os dados para geração do boleto.
                              ⚠️ **Obrigatório para o método de pagamento com
                              Boleto Bancário.** ⚠️
                            properties:
                              due_date:
                                type: string
                                description: >-
                                  Data de vencimento do Boleto. Formato:
                                  `YYYY-MM-DD`
                              instruction_lines:
                                type: object
                                description: >-
                                  Objeto contendo as linhas de instrução do
                                  Boleto.
                                properties:
                                  line_1:
                                    type: string
                                    description: >-
                                      Primeira linha de instruções sobre o
                                      pagamento do Boleto.
                                  line_2:
                                    type: string
                                    description: >-
                                      Segunda linha de instruções sobre o
                                      pagamento do Boleto.
                              holder:
                                type: object
                                description: >-
                                  Objeto contendo as informações do responsável
                                  pelo pagamento do Boleto.
                                properties:
                                  name:
                                    type: string
                                    description: >-
                                      Nome do responsável pelo pagamento do
                                      Boleto.
                                  tax_id:
                                    type: string
                                    description: >-
                                      Número do documento do responsável pelo
                                      pagamento do Boleto. <br> - CPF (11
                                      caracteres). <br> - CNPJ (14 caracteres).
                                  email:
                                    type: string
                                    description: >-
                                      E-mail do responsável pelo pagamento do
                                      Boleto.
                                  address:
                                    type: object
                                    description: >-
                                      Objeto contendo as informações de endereço
                                      do responsável pelo pagamento do Boleto.
                                    required:
                                      - street
                                      - number
                                      - locality
                                      - city
                                      - region
                                      - region_code
                                      - country
                                      - postal_code
                                    properties:
                                      street:
                                        type: string
                                        description: Rua do endereço.
                                      number:
                                        type: string
                                        description: Número do endereço.
                                      locality:
                                        type: string
                                        description: Bairro do endereço.
                                      city:
                                        type: string
                                        description: Cidade do endereço.
                                      region:
                                        type: string
                                        description: Estado do endereço
                                      region_code:
                                        type: string
                                        description: >-
                                          Código do Estado do endereço ([Padrão
                                          ISO
                                          3166-2](https://en.wikipedia.org/wiki/ISO_3166-2)).
                                      country:
                                        type: string
                                        description: >-
                                          País do endereço ([Padrão ISO 3166-1
                                          alpha-3](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3)).
                                      postal_code:
                                        type: string
                                        description: CEP do endereço.
                      notification_urls:
                        type: string
                        description: >-
                          URLs que serão notificadas em toda alteração ocorrida
                          na cobrança. ⚠️ **Necessário que seja em ambiente
                          seguro com SSL (HTTPS)** ⚠️
                      splits:
                        type: object
                        description: >-
                          Objeto contendo as contas e os valores a serem pagos
                          para transações com divisão do pagamento.⚠️
                          **Exclusivo para divisão de pagamentos.**  ⚠️
                        properties:
                          method:
                            type: string
                            description: >-
                              Especifíca como a divisão do pagamento será
                              realizada. Essa divisão pode ser definida como:
                              <br/> -`FIXED`: deve ser informado os valores
                              monetários, espeficiando o montante a ser
                              transferido para cada conta. <br/>- `PERCENTAGE`:
                              deve ser informado o percentual do montante total
                              a ser repassado para cada conta.
                            enum:
                              - FIXED
                              - PERCENTAGE
                          receivers:
                            type: array
                            description: >-
                              Especifica as contas que receberão partes
                              distintas do pagamento e define os valores ou
                              percentuais a serem transferidos para cada uma
                              delas.
                            items:
                              properties:
                                id:
                                  type: string
                                  description: Identificador único da conta do recebedor.
                                value:
                                  type: integer
                                  description: >-
                                    Define o valor ou percentual a ser atribuído
                                    a cada recebedor. <br/> - `FIXED`: informe
                                    os valores em centavos, garantindo que a
                                    soma desses valores seja igual ao total da
                                    transação. <br/>- `PERCENTAGE`: informe
                                    valores inteiros sem casas decimais,
                                    assegurando que a soma totalize 100%.
                                  format: int32
                              type: object
                    type: object
