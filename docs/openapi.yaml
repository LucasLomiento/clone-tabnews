openapi: 3.0.0
info:
  title: Nova Plataforma - Sandbox
  version: '4.1'
servers:
  - url: https://sandbox.api.pagseguro.com
components:
  securitySchemes: {}
security:
  - {}
paths:
  /public-keys:
    post:
      summary: Criar chave pública
      description: |
        Este endpoint permite que você crie uma chave pública. Chaves públicas são utilizadas para criptografia de cartões e autenticação 3DS.

        No corpo da requisição é necessário informar o tipo do recurso desejado. Por hora, apenas o tipo card está disponível.

        <Callout type="info">
        Acesse o guia do serviço de chaves públicas para mais informações sobre seu funcionamento e funcionalidades disponíveis.
        </Callout>
      operationId: criar-chave-publica
      parameters:
        - name: Authorization
          in: header
          description: Token de autenticação. Deve ser enviado no formato `Bearer <token>`.
          required: true
          schema:
            type: string
            default: Bearer <token>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  description: Define o tipo de recurso desejado.
                  enum:
                    - card
            examples:
              Request Example:
                value:
                  type: card
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: |-
                    {
                        "public_key": "",
                        "created_at": 1580237849044
                    }
              schema:
                type: object
                properties:
                  public_key:
                    type: string
                    example: >-
                      
                  created_at:
                    type: integer
                    example: 1580237849044
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /public-keys/card:
    get:
      summary: Consultar chave pública
      description: ''
      operationId: consultar-chave-publica
      parameters:
        - name: Authorization
          in: header
          description: Token de autenticação. Deve ser enviado no formato `Bearer <token>`.
          schema:
            type: string
            default: Bearer <token>
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: |-
                    {
                        "public_key": "",
                        "created_at": 1580237849044
                    }
              schema:
                type: object
                properties:
                  public_key:
                    type: string
                    example: >-
                      
                  created_at:
                    type: integer
                    example: 1580237849044
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
    put:
      summary: Alterar chave pública
      description: ''
      operationId: alterar-chave-publica
      parameters:
        - name: Authorization
          in: header
          description: Token de autenticação. Deve ser enviado no formato `Bearer <token>`.
          schema:
            type: string
            default: Bearer <token>
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: |
                    {
                        "public_key": "",
                        "created_at": 1580237849044
                    }
              schema:
                type: object
                properties:
                  public_key:
                    type: string
                    example: >-
                      
                  created_at:
                    type: integer
                    example: 1580237849044
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /accounts:
    post:
      summary: Criar conta
      description: ''
      operationId: criar-conta
      parameters:
        - name: x-client-id
          in: header
          description: Identificador único fornecido no momento da criação da aplicação.
          schema:
            type: string
        - name: x-client-secret
          in: header
          description: Chave privada fornecida no momento da criação da aplicação.
          schema:
            type: string
        - name: Authorization
          in: header
          description: Token de autenticação. Deve ser enviado no formato `Bearer <token>`.
          schema:
            type: string
            default: Bearer <token>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - email
                - person
                - tos_acceptance
              properties:
                type:
                  type: string
                  description: Tipo de conta a ser criada.
                  enum:
                    - BUYER
                    - SELLER
                    - ENTERPRISE
                business_category:
                  type: string
                  description: >-
                    Classificação do negócio. ⚠️ **Deve ser informada para todas
                    as contas dos tipo `SELLER` ou `ENTERPRISE`.** ⚠️
                  enum:
                    - ADULT_CONTENT
                    - ARCHITECTURAL_AND_ENGINEERING
                    - ART_AND_ANTIQUE
                    - BAKERY
                    - BEAUTY_AND_BARBER
                    - BROKER
                    - BUTCHERY
                    - CLOTHING_AND_ACCESSORIES
                    - DENTISTRY
                    - DOOR_TO_DOOR_SALES
                    - EDUCATION
                    - ENTERTAINMENT
                    - FLORIST
                    - FREIGHT_FORWARDER
                    - GENERAL_CONTRACTOR
                    - GOVERNMENT
                    - HEALTH_AND_BEAUTY_SERVICE
                    - HOUSEHOLD_APPLIANCE
                    - HOUSE_HOLD
                    - JEWELRY_AND_WATCH
                    - KEY_CHAIN
                    - LEGAL_SERVICE
                    - LODGING
                    - MEDICAL_SERVICE
                    - NONDURABLE_GOODS
                    - OTHER_SERVICES
                    - PACKAGE_STORE
                    - PERSONAL_TRAINER
                    - PET_SUPPLIES
                    - PHOTOGRAPHY_AND_VIDEO
                    - PODIATRIST_AND_CHIROPODIST
                    - PROFESSIONAL_SERVICE
                    - REAL_ESTATE_AGENT
                    - RELIGION_AND_SPIRITUALITY
                    - REPAIR_SHOPS
                    - RESTAURANT
                    - SHOE_STORE
                    - SUPERMARKET
                    - TAILOR_AND_SEAMSTRESS
                    - TATTOOIST
                    - TELECOMMUNICATION
                    - TRANSPORTATION_SERVICE
                    - VEHICLE_AND_PARTS
                    - VEHICLE_SERVICES
                    - VETERINARY_SERVICE
                email:
                  type: string
                  description: E-mail utilizado no login da conta.
                person:
                  type: object
                  description: >-
                    Dados do dono da conta ou de um sócio em caso de contas para
                    empresas. Apenas um sócio deverá ser informado para esse
                    caso.
                  required:
                    - name
                    - birth_date
                    - mother_name
                    - tax_id
                  properties:
                    name:
                      type: string
                      description: Nome completo do usuário ou do sócio.
                    birth_date:
                      type: string
                      description: >-
                        Data de nascimento do usuário ou do sócio. Formato a ser
                        informado: `yyyy-mm-dd`
                    mother_name:
                      type: string
                      description: Nome da mãe do dono da conta ou do sócio.
                    tax_id:
                      type: string
                      description: CPF do dono da conta ou do único sócio.
                    address:
                      type: object
                      description: Objeto contendo as informações do endereço.
                      required:
                        - street
                        - number
                        - locality
                        - city
                        - region_code
                        - country
                        - postal_code
                      properties:
                        street:
                          type: string
                          description: Rua do endereço.
                        number:
                          type: string
                          description: Número do endereço.
                        complement:
                          type: string
                          description: Complemento do endereço.
                        locality:
                          type: string
                          description: Bairro do endereço.
                        city:
                          type: string
                          description: Cidade do endereço.
                        region_code:
                          type: string
                          description: >-
                            Código do Estado do endereço ([Padrão ISO
                            3166-2](https://en.wikipedia.org/wiki/ISO_3166-2)).
                        country:
                          type: string
                          description: >-
                            País do endereço ([Padrão ISO 3166-1
                            alpha-3](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3)).
                        postal_code:
                          type: string
                          description: CEP do endereço.
                    phones:
                      type: array
                      description: Contém uma lista de telefones de contato.
                      items:
                        properties:
                          country:
                            type: string
                            description: Código de operadora do País (DDI).
                          area:
                            type: string
                            description: Código de operadora local (DDD).
                          number:
                            type: string
                            description: Número de telefone.
                        required:
                          - country
                          - area
                          - number
                        type: object
                company:
                  type: object
                  description: >-
                    Dados de cadastro da empresa em caso de contas para pessoas
                    jurídicas (SELLER). ⚠️ **Obrigatório caso você selecione
                    `type = SELLER`. **⚠️
                  properties:
                    name:
                      type: string
                      description: Razão Social da empresa.
                    tax_id:
                      type: string
                      description: CNPJ da empresa.
                    address:
                      type: object
                      description: Objeto contendo as informações do endereço da empresa.
                      required:
                        - street
                        - number
                        - locality
                        - city
                        - region_code
                        - country
                        - postal_code
                      properties:
                        street:
                          type: string
                          description: Rua do endereço.
                        number:
                          type: string
                          description: Número do endereço.
                        complement:
                          type: string
                          description: Complemento do endereço.
                        locality:
                          type: string
                          description: Bairro do endereço.
                        city:
                          type: string
                          description: Cidade do endereço.
                        region_code:
                          type: string
                          description: >-
                            Código do Estado do endereço ([Padrão ISO
                            3166-2](https://en.wikipedia.org/wiki/ISO_3166-2)).
                        country:
                          type: string
                          description: >-
                            País do endereço ([Padrão ISO 3166-1
                            alpha-3](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3)).
                        postal_code:
                          type: string
                          description: CEP do endereço.
                    phones:
                      type: array
                      description: Objeto contendo uma lista de telefones da empresa.
                      items:
                        properties:
                          country:
                            type: string
                            description: Código de operadora do País (DDI).
                          area:
                            type: string
                            description: Código de operadora local (DDD).
                          number:
                            type: string
                            description: Número de telefone.
                        required:
                          - country
                          - area
                          - number
                        type: object
                tos_acceptance:
                  type: object
                  description: >-
                    Aceite do "termos de aceite" do dono da conta na plataforma
                    do parceiro.
                  properties:
                    user_ip:
                      type: string
                      description: >-
                        IP que identifica o dispositivo em que o dono da conta
                        concordou com os termos de aceite na plataforma do
                        parceiro.
                    date:
                      type: string
                      description: >-
                        Momento em que o usuário concordou com os termos de
                        aceite na plataforma do parceiro.
            examples:
              Criar conta (BUYER):
                value:
                  type: BUYER
                  email: teste@sandboxpagseguro.com.br
