  /oauth2/token:
    post:
      summary: Obter access token
      description: ''
      operationId: obter-access-token
      parameters:
        - name: Authorization
          in: header
          description: Token de autenticação. Deve ser enviado no formato `Bearer <token>`.
          schema:
            type: string
            default: Bearer <token>
        - name: X_CLIENT_ID
          in: header
          description: Identificador único fornecido no momento da criação da aplicação.
          schema:
            type: string
        - name: X_CLIENT_SECRET
          in: header
          description: Chave privada a aplicação fornecida no momento da criação.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  description: Indica o tipo de autenticação utilizada.
                  enum:
                    - sms
                    - authorization_code
                    - challenge
                code:
                  type: string
                  description: >-
                    Código que foi enviado para URL no momento da permissão
                    usuário (Connect Authorization). Obrigatório quando
                    `grant_type = authorization_code`.
                sms_code:
                  type: string
                  description: >-
                    Código SMS enviado para o número cadastrado na base
                    PagSeguro (Connect SMS). Obrigatório quando `grant_type =
                    sms`.
                redirect_uri:
                  type: string
                  description: >-
                    URL de redirecionamento do cliente, deve ser a mesma do
                    momento da permissão. Obrigatório quando `grant_type =
                    authorization_code`.
                email:
                  type: string
                  description: >-
                    E-mail do cliente PagBank que deseja conceder permissão para
                    o parceiro efetuar ações em nome dele na plataforma
                    PagSeguro. Obrigatório quando `grant_type = sms`.
                scope:
                  type: string
                  description: >-
                    Nome do escopo. Quando `grant_tpe` for informado como
                    `challenge`, obrigatoriamente use `certificate.create` para
                    solicitar a criação de um certificado digital.
                authorization_id:
                  type: string
                  description: >-
                    Identifica a autorização obtida ao solicitar a autorização
                    via SMS.
            examples:
              Connect SMS:
                value:
                  grant_type: sms
                  authorization_id: ASMS_91CC93B3-295B-4C0E-B09C-FE6B40FF43CD
                  sms_code: '123456'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Connect SMS:
                  value: |-
                    {
                        "token_type": "bearer",
                        "access_token": "2YotnFZFEjr1zCsicMWpAA",
                        "expires_in": "xxxxxx",
                        "refresh_token": "tGzv3JOkF0XG5Qx2TlKWIA",
                        "scope": "scope.name",
                        "account_id": "ACCO_737348328392943"
                    }
                Connect Authorization:
                  value: |-
                    {
                      "token_type": "bearer",
                      "access_token": "2YotnFZFEjr1zCsicMWpAA",
                      "expires_in": "xxxxxx",
                      "refresh_token": "tGzv3JOkF0XG5Qx2TlKWIA",
                      "scope": "scope.name",
                      "account_id": "ACCO_737348328392943"
                    }
                Challenge:
                  value: |-
                    {
                        "access_token": "898a9c83-4b41-4363-9e10-6177053ba648",
                        "token_type": "Bearer",
                        "expires_in": 300,
                        "scope": "certificate.create",
                        "challenge": ""
                    }
              schema:
                oneOf:
                  - title: Connect SMS
                    type: object
                    properties:
                      token_type:
                        type: string
                        example: bearer
                      access_token:
                        type: string
                        example: 2YotnFZFEjr1zCsicMWpAA
                      expires_in:
                        type: string
                        example: xxxxxx
                      refresh_token:
                        type: string
                        example: tGzv3JOkF0XG5Qx2TlKWIA
                      scope:
                        type: string
                        example: scope.name
                      account_id:
                        type: string
                        example: ACCO_737348328392943
                  - title: Connect Authorization
                    type: object
                    properties:
                      token_type:
                        type: string
                        example: bearer
                      access_token:
                        type: string
                        example: 2YotnFZFEjr1zCsicMWpAA
                      expires_in:
                        type: string
                        example: xxxxxx
                      refresh_token:
                        type: string
                        example: tGzv3JOkF0XG5Qx2TlKWIA
                      scope:
                        type: string
                        example: scope.name
                      account_id:
                        type: string
                        example: ACCO_737348328392943
                  - title: Challenge
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: 898a9c83-4b41-4363-9e10-6177053ba648
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 300
                        default: 0
                      scope:
                        type: string
                        example: certificate.create
                      challenge:
                        type: string
                        example: >-
                          
