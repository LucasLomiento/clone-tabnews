  /tokens/cards:
    post:
      summary: Validar e armazenar um cartão no PagBank
      description: ''
      operationId: validar-armanezar-cartao-pagbank
      parameters:
        - name: Authorization
          in: header
          description: Token de autenticação. Deve ser enviado no formato `Bearer <token>`.
          schema:
            type: string
            default: Bearer <token>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                encrypted:
                  type: string
                  description: >-
                    Dados do cartão criptografados. ⚠️ **Obrigatório quando o
                    integrador NÃO possuir certificação PCI** ⚠️ ⚠️ **Caso este
                    parâmtero for preenchido, nenhum outro parâmetro deverá ser
                    enviado** ⚠️
                number:
                  type: string
                  description: >-
                    Número do Cartão de Crédito. ⚠️ **Aplicável apenas quando o
                    integrador possuir certificação PCI** ⚠️
                exp_month:
                  type: string
                  description: >-
                    Mês de expiração do Cartão de Crédito. ⚠️ **Aplicável apenas
                    quando o integrador possuir certificação PCI** ⚠️
                exp_year:
                  type: string
                  description: >-
                    Ano de expiração do Cartão de Crédito. ⚠️ **Aplicável apenas
                    quando o integrador possuir certificação PCI** ⚠️
                security_code:
                  type: string
                  description: >-
                    Código de Segurança do Cartão de Crédito. ⚠️ **Aplicável
                    apenas quando o integrador possuir certificação PCI** ⚠️
                holder:
                  type: object
                  description: >-
                    Portador do cartão de crédito. ⚠️ **Aplicável apenas quando
                    o integrador possuir certificação PCI** ⚠️ ⚠️ **Caso o
                    parâmetro "encrypted" estiver preenchido, este parâmetro
                    poderá ser enviado de forma opcional** ⚠️
                  properties:
                    name:
                      type: string
                      description: >-
                        Nome do portador do Cartão de Crédito, Cartão de Débito
                        e Token de Bandeira. ⚠️ **Obrigatório para cobranças com
                        3DS e Criptografia** ⚠️
                    tax_id:
                      type: string
                      description: >-
                        Documento de identificação (CPF) do portador do Cartão
                        de Crédito, Cartão de Débito e Token de Bandeira.
            examples:
              Cartão criptografado (Vendedores não PCI):
                value:
                  encrypted: >-
                    
              Cartão aberto (Vendedores PCI):
                value:
                  number: '5590800827578129'
                  exp_month: '04'
                  exp_year: '2024'
                  security_code: '123'
                  holder:
                    name: Jose da Silva
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: |-
                    {
                        "id": "CARD_4350C260-C6C8-4E29-B6F1-4470E33A7866",
                        "brand": "mastercard",
                        "first_digits": "559080",
                        "last_digits": "8129",
                        "exp_month": "04",
                        "exp_year": "2024",
                        "holder": {
                            "name": "Jose da Silva"
                        }
                    }
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: CARD_4350C260-C6C8-4E29-B6F1-4470E33A7866
                  brand:
                    type: string
                    example: mastercard
                  first_digits:
                    type: string
                    example: '559080'
                  last_digits:
                    type: string
                    example: '8129'
                  exp_month:
                    type: string
                    example: '04'
                  exp_year:
                    type: string
                    example: '2024'
                  holder:
                    type: object
                    properties:
                      name:
                        type: string
                        example: Jose da Silva
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: |-
                    {
                        "error_messages": [
                            {
                                "message": "exp_year_is_invalid",
                                "description": "Parameter 'exp_year' has an invalid value, see documentation.",
                                "parameter_name": "exp_year"
                            }
                        ]
                    }
              schema:
                type: object
                properties:
                  error_messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: exp_year_is_invalid
                        description:
                          type: string
                          example: >-
                            Parameter 'exp_year' has an invalid value, see
