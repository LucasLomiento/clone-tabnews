  /checkouts/old:
    post:
      summary: Criar Checkout
      description: Utilize este endpoint para solicitar a criação de um checkout
      operationId: criar-checkout-old
      parameters:
        - name: Content-type
          in: header
          schema:
            type: string
            default: application/json
        - name: Authorization
          in: header
          description: Bearer TOKEN
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reference_id:
                  type: string
                  description: >-
                    Id de referência para o checkout informado pelo vendedor na
                    criação do checkout. Limite: 64 caracteres
                expiration_date:
                  type: string
                  description: >-
                    Data de expiração do checkout. Caso não seja informado, a
                    data de expiração será a data e hora atual + 2 horas. Padrão
                    esperado: ISO-8601 Date time with timezone offset
                customer:
                  properties:
                    email:
                      type: string
                      description: >-
                        E-mail do cliente informado pelo vendedor. Obrigatório
                        caso "customer_modifiable" for false. Limite: 10 - 60
                        caracteres
                    tax_id:
                      type: string
                      description: >-
                        Número do CPF ou CNPJ do cliente informado pelo
                        vendedor. Obrigatório caso "customer_modifiable" for
                        false. Limite: 11/14 caracteres
                    phone:
                      properties:
                        country:
                          type: string
                          description: >-
                            Código do País (DDI) do telefone do cliente
                            informado pelo vendedor. Obrigatório caso
                            "customer_modifiable" for false. Limite: 2 - 3
                            caracteres
                        area:
                          type: string
                          description: >-
                            Código de Área (DDD) do telefone do cliente
                            informado pelo vendedor. Obrigatório caso
                            "customer_modifiable" for false. Limite: 2
                            caracteres
                        number:
                          type: string
                          description: >-
                            Número do telefone do cliente informado pelo
                            vendedor. Obrigatório caso "customer_modifiable" for
                            false. Limite: 9 caracteres
                      
                      type: object
                  
                  type: object
                  description: >-
                    Dados pessoais do cliente informado pelo vendedor.
                    Obrigatório caso "customer_modifiable" for false.
                customer_modifiable:
                  type: boolean
                  description: >-
                    Indicador da imutabilidade dos dados pessoais na criação do
                    checkout, possibilitando pular o step de dados pessoais.
                    Caso não informado, o valor padrão é true.  Regras do
                    campo:  O objeto customer torna-se obrigatório caso o valor
                    informado seja false.
                items:
                  properties:
                    reference_id:
                      type: string
                      description: >-
                        Referência do produto informado pelo vendedor. Limite:
                        100 caracteres
                    name:
                      type: string
                      description: >-
                        Nome do produto informado pelo vendedor. Limite: 1 - 100
                        caracteres
                    quantity:
                      type: integer
                      description: >-
                        Quantidade do produto informado pelo vendedor. Integer
                        (1 - 999)
                      format: int32
                    unit_amount:
                      type: integer
                      description: >-
                        Valor unitário do produto informado pelo vendedor (Em
                        centavos). Integer (0 - 999999900)
                      format: int32
                  
                  type: object
                  description: >-
                    Lista de produtos informado pelo vendedor, deve conter no
                    mínimo Nome, Quantidade e Valor unitário.
                additional_amount:
                  type: integer
                  description: >-
                    Valor adicional a ser cobrado (Em centavos). BigInteger (0 -
                    999999900)
                  format: int32
                discount_amount:
                  type: integer
                  description: >-
                    Valor a ser descontado do valor total (Em centavos).
                    BigInteger (0 - 999999900)
                  format: int32
                shipping:
                  properties:
                    type:
                      type: string
                      description: Tipo de entrega ('FIXED', 'FREE' ou 'CALCULATE').
                      enum:
                        - FIXED
                        - FREE
                        - CALCULATE
                    service_type:
                      type: string
                      description: >-
                        Tipo de frete a ser utilizadoTipo de serviço de entrega
                        ('SEDEX', 'PAC') utilizado no frete calculado. Caso não
                        seja informado, o cliente poderá escolher entre as
                        cotações de PAC e SEDEX na tela.
                      enum:
                        - PA'
                        - SEDEX
                    amout:
                      type: integer
                      description: >-
                        Valor de custo da entrega (Em centavos). Integer (0 -
                        2147483647)
                      format: int32
                    address:
                      properties:
                        country:
                          type: string
                          description: >-
                            País do endereço de entrega. Padrão aceito: ISO
                            3166-1 alfa-3
                        region_code:
                          type: string
                          description: >-
                            Estado do endereço de entrega. Padrão aceito: ISO
                            3166-1 alfa-3
                        city:
                          type: string
                          description: >-
                            Cidade do endereço de entrega. Limite: 1 - 90
                            caracteres
                        postal_code:
                          type: string
                          description: 'CEP do endereço de entrega. Aceito: 8 caracteres'
                        street:
                          type: string
                          description: >-
                            Logradouro do endereço de entrega. Limite: 1 - 160
                            caracteres
                        number:
                          type: string
                          description: >-
                            Número do endereço de entrega. Limite: 1 - 20
                            caracteres
                        locality:
                          type: string
                          description: >-
                            Bairro do endereço de entrega. Limite: 1 - 60
                            caracteres
                        complement:
                          type: string
                          description: >-
                            Complemento do endereço de entrega. Limite: 1 - 40
                            caracteres
                      
                      type: object
                    address_modifiable:
                      type: boolean
                      description: >-
                        Indicador de endereço ser alterável na tela de endereço
                        de entrega do checkout.
                    box:
                      properties:
                        dimensions:
                          properties:
                            length:
                              type: integer
                              description: >-
                                Comprimento da caixa em centímetros. Integer (15
                                - 100)
                              format: int32
                            width:
                              type: integer
                              description: >-
                                Largura da caixa em centímetros. Integer (10 -
                                100)
                              format: int32
                            height:
                              type: integer
                              description: >-
                                Altura da caixa em centímetros. Integer (1 -
                                100)
                              format: int32
                          
                          type: object
                        weight:
                          type: integer
                          description: Peso da caixa (em gramas). Integer (300 - 10000)
                          format: int32
                      
                      type: object
                  
                  type: object
                  description: >-
                    Dados de entrega do produto, caso não informado será
                    considerado que não há necessidade de entrega, caso
                    informado, deve indicar se o valor da entrega é Fixo ou
                    Grátis.
                payment_methods:
                  properties:
                    type:
                      type: string
                      description: >-
                        Meio de pagamento escolhido pelo vendedor
                        ('CREDIT_CARD', 'DEBIT_CARD', ‘BOLETO’, ‘PIX’)
                      enum:
                        - CREDIT_CARD
                        - DEBIT_CARD
                        - BOLETO
                        - PIX
                    brands:
                      type: array
                      description: >-
                        Quando o campo payment_methods[].type for ‘CREDIT_CARD’
                        ou ‘DEBIT_CARD’, pode ser passada um lista com as
                        bandeiras de cartões aceitas pelo vendedor neste campo.
                        Ver lista de bandeiras aceitas.
                      items:
                        type: string
                  
                  type: object
                  description: Meios de pagamento aceitos.
                payment_methods_configs:
                  properties:
                    type:
                      type: string
                      description: >-
                        Meio de pagamento que receberá algum tipo de
                        configuração ('CREDIT_CARD', ‘DEBIT_CARD’).
                      enum:
                        - CREDIT_CARD
                        - DEBIT_CARD
                    brands:
                      type: string
                      description: >-
                        Lista com as bandeiras de cartões que receberão algum
                        tipo de configuração. Ver lista de bandeiras aceitas.
                      enum:
                        - ''
                    config_options:
                      properties:
                        options:
                          type: string
                          description: >-
                            Opção de configuração dada a um meio de pagamento
                            ('INSTALLMENTS_LIMIT').
                          enum:
                            - '''INSTALLMENTS_LIMIT'''
                        value:
                          type: string
                          description: Valor da configuração dada a um meio de pagamento.
                      
                      type: object
                  
                  type: object
                  description: Configurações dos meios de pagamento.
                soft_descriptor:
                  type: string
                  description: >-
                    Texto adicional que será apresentado junto ao nome do
                    estabelecimento na fatura do cartão de crédito do comprador.
                    Limite: 17 caracteres
                redirect_url:
                  type: string
                  description: >-
                    URL para redirecionamento após pagamento. Limite: 255
                    caracteres
                notification_urls:
                  type: array
                  description: >-
                    Lista de URLs para notificação de status do checkout.
                    Limite: (5-100 caracteres)
                  items:
                    type: string
                payment_notification_urls:
                  type: array
                  description: >-
                    Lista de URLs para notificação dos status de pagamento.
                    Limite: (5-100 caracteres)
                  items:
                    type: string
      responses:
