  /checkouts:
    post:
      summary: Criar Checkout
      description: ''
      operationId: criar-checkout
      parameters:
        - name: Authorization
          in: header
          description: Token de autenticação. Deve ser enviado no formato `Bearer <token>`.
          schema:
            type: string
            default: Bearer <token>
        - name: Content-type
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reference_id:
                  type: string
                  description: >-
                    Identificador único atribuído para o pedido. Utilizado
                    internamente pelo vendedor em seu sistema (Max 64
                    caracteres).
                expiration_date:
                  type: string
                  description: >-
                    Data de expiração do checkout (ISO-8601). Caso não seja
                    informado, a data de expiração será a data e hora do momento
                    da criação do checkout + 2 horas.
                  format: date-time
                customer:
                  type: object
                  description: >-
                    Objeto contendo os dados pessoais do comprador. ⚠️ ** Deve
                    ser informado caso `customer_modifiable` seja `false`. Nesse
                    caso todos os parâmetros deste objeto são obrigatórios.** ⚠️
                  properties:
                    Name:
                      type: string
                      description: >-
                        Nome do cliente, devendo conter nome e sobrenome.
                        Caracteres especiais são permitidos, porém eles serão
                        removidos. Apóstrofo e números são aceitos e não serão
                        removidos.
                    email:
                      type: string
                      description: E-mail do cliente.
                    tax_id:
                      type: string
                      description: >-
                        Documento de identificação pessoal do cliente.  <br> -
                        CPF (11 caracteres). <br> - CNPJ (14 caracteres).
                    phone:
                      type: object
                      description: Objeto com os dados do telefone do cliente.
                      properties:
                        country:
                          type: string
                          description: >-
                            Código do país (DDI) do telefone do cliente (2-3
                            caracteres). Somente o caracter especias `+` é
                            aceito. Somente o código do Brasil (55) é aceito.
                        area:
                          type: string
                          description: >-
                            Código de área (DDD) do telefone do cliente (2
                            caracteres).
                        number:
                          type: string
                          description: >-
                            Número do telefone do cliente contendo 9 caracteres.
                            Deve sempre iniciar com o número 9.
                customer_modifiable:
                  type: boolean
                  description: >-
                    Indicador da imutabilidade dos dados pessoais na criação do
                    checkout, possibilitando pular o step de dados pessoais.
                    Caso não informado, o valor padrão é `true`.  ⚠️ **O objeto
                    `customer` torna-se obrigatório caso o valor informado seja
                    `false** ⚠️
                items:
                  type: array
                  description: >-
                    Lista de produtos associados ao pedido. ⚠️ **Obrigatório**
                    ⚠️
                  items:
                    properties:
                      reference_id:
                        type: string
                        description: >-
                          Referência do produto informado vendedor (Max 100
                          caracteres).
                      name:
                        type: string
                        description: >-
                          Nome do produto informado pelo vendedor (Max 100
                          caracteres).
                      description:
                        type: string
                        description: >-
                          Descrição do produto informado pelo vendedor (Max 255
                          caracteres).
                      quantity:
                        type: integer
                        description: >-
                          Quantidade do produto associado ao pedido. ⚠️
                          **Obrigatório** ⚠️
                        format: int32
                      unit_amount:
                        type: integer
                        description: >-
                          Valor unitário do produto. Informado em centavos (Max
                          999999900). ⚠️ **Obrigatório** ⚠️
                        format: int32
                      image_url:
                        type: string
                        description: >-
                          URL da imagem do produto. Essa imagem será utilizada
                          ao apresentar a lista de items na página do checkout.
                          A imagem precisa atender aos seguintes requisitos:
                          <br/>- Extensões aceitas: `.png`, `.jpg`, `.jpeg`
                          <br/>- Formato: Imagem JPG/PNG <br/>- Tamanho máximo
                          do arquivo: 15Mb.
                    type: object
                additional_amount:
                  type: integer
                  description: >-
                    Valor adicional a ser cobrado definido em centavos (Max
                    999999900). Esse é um valor complementar ao valor total
                    resultande da soma dos items pertencentes ao pedido.
                  format: int32
                discount_amount:
                  type: integer
                  description: >-
                    Valor a ser descontado do valor total da compra (Max
                    999999900). O valor do desconto é informado em centavos. O
                    valor informado não deve superar a soma do valor total dos
                    itens somado ao valor adicional (`additional_amount).
                  format: int32
                shipping:
                  type: object
                  description: >-
                    Dados de entrega do produto. Caso não informado é
                    considerado que não existe a necessidade de realizar a
                    entrega. Caso seja informado, é necessário definir se o
                    valor da entrega é fixo, grátis ou calculado.
                  properties:
                    type:
                      type: string
                      description: Tipo de entrega associada ao pedido.
                      enum:
                        - FIXED
                        - FREE
                        - CALCULATE
                    service_type:
                      type: string
                      description: >-
                        Tipo de serviço de entrega utilizado para calcular o
                        frete. Caso não seja informado, o cliente poderá
                        escolher entre as opções na tela do checkout.
                      enum:
                        - SEDEX
                        - PAC
                    address_modifiable:
                      type: boolean
                      description: >-
                        Indica se o endereço pode ser alterado na tela de
                        endereço de entrega do checkout. Caso não informado, o
                        valor padrão é `true`. Caso você selecione a opção
                        `false`, o objeto `shipping.address` torna-se
                        obrigatório.
                    amount:
                      type: integer
                      description: >-
                        Valor do custo da entrega em centavos (Max 2147483647).
                        ⚠️ **Obrigatório caso `shipping.type` seja `FIXED`** ⚠️
                      format: int32
                    address:
                      type: object
                      description: >-
                        Endereço de entrega. ⚠️ **Obrigatório caso
                        `address_modifiable` seja `false` ** ⚠️
                      properties:
                        street:
                          type: string
                          description: >-
                            Logradouro do endereço de entrega (Max 160
                            caracteres). ⚠️ **Obrigatório.** ⚠️
                        number:
                          type: string
                          description: >-
                            Número do endereço de entrega (Max 20 caracteres).
                            ⚠️ **Obrigatório.** ⚠️
                        complement:
                          type: string
                          description: Complemento do endereço de entrega.
                        locality:
                          type: string
                          description: >-
                            Bairro do endereço de entrega (Max 60 caracteres).
                            ⚠️ **Obrigatório.** ⚠️
                        city:
                          type: string
                          description: >-
                            Cidade do endereço de entrega (Max 90 caracteres).
                            ⚠️ **Obrigatório.** ⚠️
                        region_code:
                          type: string
                          description: >-
                            Estado do endereço de entrega (ISO 3166-1 alfa-3).
                            ⚠️ **Obrigatório.** ⚠️
                        country:
                          type: string
                          description: >-
                            País do endereço de entrega (ISO 3166-1 alfa-3). ⚠️
