            format: int32
            default: 10
        - name: max_installments_no_interest
          in: query
          description: Quantidade de parcelas assumidas pelo vendedor.
          schema:
            type: integer
            format: int32
            default: 4
        - name: credit_card_bin
          in: query
          description: BIN do cartão, ou seja, os seis primeiros números do cartão.
          schema:
            type: integer
            format: int32
            default: 552100
        - name: Authorization
          in: header
          description: Token de autenticação. Deve ser enviado no formato `Bearer <token>`.
          required: true
          schema:
            type: string
            default: Bearer <token>
        - name: Content-Type
          in: header
          description: 'O tipo de mídia do recurso. Exemplo: `application/json`'
          schema:
            type: string
        - name: show_seller_fees
          in: query
