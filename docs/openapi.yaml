  /orders:
    post:
      summary: Criar pedido
      description: ''
      operationId: criar-pedido
      parameters:
        - name: Authorization
          in: header
          description: Token de autenticação. Deve ser enviado no formato `Bearer <token>`.
          required: true
          schema:
            type: string
            default: Bearer <token>
        - name: x-idempotency-key
          in: header
          description: Chave de idempotência.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - customer
              properties:
                reference_id:
                  type: string
                  description: O Identificador único atribuído para o pedido.
                customer:
                  type: object
                  description: Objeto contendo as informações do comprador.
                  required:
                    - tax_id
                  properties:
                    name:
                      type: string
                      description: >-
                        Nome do cliente, devendo conter nome e sobrenome.
                        Caracteres especiais são permitidos, porém eles serão
                        removidos. Apóstrofo e números são aceitos e não serão
                        removidos.
                    email:
                      type: string
                      description: E-mail do cliente.
                    tax_id:
                      type: string
                      description: >-
                        Documento de identificação pessoal do cliente. ⚠️
                        **Obrigatório.** ⚠️ <br> - CPF (11 caracteres). <br> -
                        CNPJ (14 caracteres).
                    phones:
                      type: array
                      description: Contém uma lista de telefones do cliente.
                      items:
                        properties:
                          country:
                            type: string
                            description: Código de operadora do País (DDI).
                          area:
                            type: string
                            description: Código de operadora local (DDD).
                          number:
                            type: string
                            description: Número de telefone.
                        required:
                          - country
                          - area
                          - number
                        type: object
                items:
                  type: array
                  description: Contém as informações dos itens inseridos no pedido.
                  items:
                    properties:
                      name:
                        type: string
                        description: Nome dado ao item.
                      quantity:
                        type: integer
                        description: Quantidade referente ao item.
                        format: int32
                      unit_amount:
                        type: integer
                        description: Valor unitário do item.
                        format: int32
                    type: object
                shipping:
                  type: object
                  description: Contém as informações de entrega do pedido.
                  properties:
                    address:
                      type: object
                      description: Contém informações do endereço de entrega do pedido.
                      required:
                        - street
                        - number
                        - locality
                        - city
                        - region_code
                        - country
                        - postal_code
                      properties:
                        street:
                          type: string
                          description: Rua do endereço.
                        number:
                          type: string
                          description: Número do endereço.
                        complement:
                          type: string
                          description: Complemento do endereço.
                        locality:
                          type: string
                          description: Bairro do endereço.
                        city:
                          type: string
                          description: Cidade do endereço.
                        region_code:
                          type: string
                          description: >-
                            Código do Estado do endereço ([Padrão ISO
                            3166-2](https://en.wikipedia.org/wiki/ISO_3166-2)).
                        country:
                          type: string
                          description: >-
                            País do endereço ([Padrão ISO 3166-1
                            alpha-3](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3)).
                        postal_code:
                          type: string
                          description: CEP do endereço.
                qr_codes:
                  type: array
                  description: >-
                    Objeto contendo informação do valor do pedido para pagar com
                    QR Code exclusivo do PagBank (Carteira Digital).
                  items:
                    properties:
                      amount:
                        type: object
                        description: >-
                          Objeto contendo as informações do valor a ser
                          utilizado no QR Code.
                        properties:
                          value:
                            type: string
                            description: Valor do QR Code.
                      expiration_date:
                        type: string
                        description: Data de expiração do QR code.
                    type: object
                notification_urls:
                  type: array
                  description: >-
                    Objeto contendo as urls que receberão as notificações do
                    pedido.
                  items:
                    type: string
                charges:
                  type: array
                  description: >-
                    Contêm as informações necessárias para a execução da
                    cobrança, definindo os dados do meio de pagamento e o valor
                    do pedido.
                  items:
                    properties:
                      reference_id:
                        type: string
                        description: Identificador único atribuído para a cobrança.
                      description:
                        type: string
                        description: Descrição da cobrança.
                      amount:
                        type: object
                        description: Especifica a quantia da cobrança, com o valor e moeda.
                        properties:
                          value:
                            type: integer
                            description: >-
                              Valor a ser cobrado em centavos. Apenas números
                              inteiros positivos. <br/>Exemplo: R$ 1.500,99 =
                              150099
                            format: int32
                          currency:
                            type: string
                            description: >-
                              Código de moeda ISO de três letras, em maiúsculo.
                              Por enquanto, apenas o Real brasileiro é suportado
                              (BRL).
                      payment_method:
                        type: object
                        description: >-
                          Contém as informações do método de pagamento da
                          cobrança.
                        properties:
                          type:
                            type: string
                            description: >-
                              Indica o método de pagamento usado na cobrança.
                              <br>- `CREDIT_CARD` para Cartão de Crédito ou
                              `DEBIT_CARD` para Cartão de Débito. ⚠️
                              **Obrigatório o envio do objeto `card`.** ⚠️ <br>-
                              `BOLETO` para Boleto. ⚠️ **Obrigatório o envio do
                              objeto `boleto` com as informações adicionais
                              desse objeto.** ⚠️
                            enum:
                              - CREDIT_CARD
                              - DEBIT_CARD
                              - BOLETO
                          installments:
                            type: integer
                            description: >-
                              Quantidade de parcelas. ⚠️ **Obrigatório para o
                              método de pagamento Cartão de Crédito.** ⚠️
                            format: int32
                          capture:
                            type: boolean
                            description: >-
                              Parâmetro que indica se uma transação de cartão de
                              crédito deve ser apenas pré-autorizada (reserva o
                              valor da cobrança no cartão do cliente de 6 até 29
                              dias) ou se a transação deve ser capturada
                              automaticamente (cobrança realizada em apenas um
                              passo). ⚠️ **Obrigatório para o método de
                              pagamento cartão de crédito.** ⚠️ ⚠️ **Função
                              indisponível para o método de pagamento cartão de
                              débito e token de bandeira (crédito).** ⚠️ <br> -
                              `VISA`,`MASTERCARD` e `ELO` permitirá à captura
                              com cartão de crédito e token de bandeira em até
                              29 dias(<a
                              href="https://dev.pagbank.uol.com.br/docs/cobrando-com-cartao-de-credito"
                              target="_blank">Lista de MCCs
                              disponíveis</a>).<br>- `AMEX` e `HIPERCARD`
                              permitirá à captura apenas com o cartão de crédito
                              e em até 6 dias.  <br><br> - Informar `false` para
                              pré-autorizar. Informar `true` para cobrança em um
                              passo.
                          soft_descriptor:
                            type: string
                            description: >-
                              Parâmetro responsável pelo que será exibido como
                              **Nome na Fatura do cliente**. ⚠️ **Aplicável no
