                                "description": "Invalid credentials. Review AUTHORIZATION, X_CLIENT_ID and X_CLIENT_SECRET headers"
                            }
                        ]
                    }
              schema:
                type: object
                properties:
                  error_messages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: INVALID_CREDENTIAL
                        description:
                          type: string
                          example: >-
                            Invalid credentials. Review AUTHORIZATION,
                            X_CLIENT_ID and X_CLIENT_SECRET headers
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Result:
                  value: |-
                    {
                        "error_messages": [
                            {
                                "code": "USER_TEMPORARILY_BLOCKED",
                                "description": "User temporarily blocked for SMS interactions. Try again later"
                            }
                        ]
                    }
              schema:
                oneOf:
                  - type: object
                    properties:
                      error_messages:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: UNREACHABLE_PHONE
                            description:
                              type: string
                              example: >-
                                Unable to contact account phone number. Merchant
                                have to contact PagSeguro
                  - type: object
                    properties:
                      error_messages:
                        type: array
                        items:
