  /charges/{charge_id}/cancel:
    post:
      summary: Cancelar pagamento
      description: ''
      operationId: cancelar-pagamento
      parameters:
        - name: charge_id
          in: path
          description: >-
            Identificador da cobrança PagBank. Formato: `CHAR_XXXXXXXXXXXXX`
            <br/>Esse parâmetro você receberá na resposta da criação do pedido
            como `charge.id`.
          schema:
            type: string
          required: true
        - name: Authorization
          in: header
          description: Token de autenticação. Deve ser enviado no formato `Bearer <token>`.
          schema:
            type: string
            default: Bearer <token>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: object
                  description: Contém as informações do valor da cobrança.
                  properties:
                    value:
                      type: integer
                      description: >-
                        Valor a ser cobrado em centavos. Apenas números inteiros
                        positivos. <br/>Exemplo: R$ 1.500,99 = 150099
                      format: int32
                splits:
                  type: object
                  description: >-
                    Utilizado para cancelamento customizado de pedidos com
                    divisão de pagamento. Informa o método e os recebedores
                    envolvidos.
                  properties:
                    method:
                      type: string
                      description: >-
                        Especifica como a divisão do cancelamento será
                        realizada, podendo ser: <br/> - `FIXED`: deve ser
                        informado os valores monetários a ser debitado da conta
                        de cada recebedor. <br/> `PERCENTAGE`: deve ser
                        informado o percentual do montante do cancelamento a ser
                        debitado da conta de cada recebedor.
                      enum:
                        - FIXED
                        - PERCENTAGE
                    receivers:
                      type: array
                      description: >-
                        Especifica as contas que terão valores debitados após o
                        cancelamento, informando o valor ou percentual a ser
                        debitado.
                      items:
                        properties:
                          account:
                            type: object
                            description: >-
                              Informa os dados do recebedor que terá fundos
                              debitados da conta após o cancelamento.
                            properties:
                              id:
                                type: string
                                description: >-
                                  Identificador da conta do recebedor
                                  participante da operação de cancelamento.
                          amount:
                            type: object
                            description: >-
                              Informa o valor ou percentual da operação de
                              cancelamento a ser debitado da conta do recebedor.
                            properties:
                              value:
                                type: integer
                                description: >-
                                  Valor fixo ou percentual que deve ser debitado
                                  da conta do recebedor participante da operação
                                  de cancelamento.
                                format: int32
                          configurations:
                            type: object
                            description: >-
                              Informa se o recebedor será responsável por arcar
                              com as táxas reembolsáveis ou com as diferenças
                              decorrentes dos arredondamentos.
                            properties:
                              refund:
                                type: object
                                description: >-
                                  Objeto especificando se o recebedor será
                                  responsável por arcar diferenças decorrentes
                                  de arredondamentos.
                                properties:
                                  rounding_liable:
                                    type: object
                                    description: >-
                                      Objeto especificando se o recebedor será
                                      responsável por arcar diferenças
                                      decorrentes de arredondamentos.
                                    properties:
                                      apply:
                                        type: boolean
                                        description: >-
                                          Informa se o recebedor será responsável
                                          por arcar com diferenças decorrentes do
                                          processo de arredondamentos para duas
                                          casas decimais.
                              fee_liable:
                                type: object
                                description: >-
                                  Objeto especificando se o recebedor irá arcar
                                  com as taxas reembolsáveil.
                                properties:
                                  percentage:
                                    type: integer
                                    description: >-
                                      Especifica o valor percentual que será
                                      debitado da conta do recebedor para arcar
                                      com o valor das taxas reembolsáveis.
                                      **Como somente um recebedor pode ser
                                      responsável, sempre deve ser informado o
                                      valor de 100 (100%)**.
                                    format: int32
                        type: object
            examples:
              Estornar cobrança (valor parcial):
                value:
                  amount:
                    value: 500
              Estornar cobrança (valor total):
                value:
                  amount:
                    value: 1000
              Cancelamento customizado (divisão de pagamento):
                value:
                  amount:
                    value: 10000
                  splits:
                    method: FIXED
                    receivers:
                      - account:
                          id: ACCO_B65AE001-EA74-4E53-9645-21D08FE7CC61
                        amount:
                          value: 2000
                        configurations:
                          refund:
                            rounding_liable:
                              apply: true
                            fee_liable:
                              percentage: 100
                      - account:
                          id: ACCO_C4B62A20-ECB0-4145-BA75-9B902FA0526B
                        amount:
                          value: 8000
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Estornar cobrança (valor parcial):
                  value: |-
                    {
                      "id": "CHAR_D32A01A9-92A6-4755-B21D-7B6A1291F7AD",
